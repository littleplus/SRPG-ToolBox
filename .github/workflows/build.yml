name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: SRPG_Unpacker/SRPG_Unpacker.sln
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64, x86]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild ${{env.SOLUTION_FILE_PATH}} /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{matrix.platform}}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SRPG_Unpacker-${{env.BUILD_CONFIGURATION}}-${{matrix.platform}}
        path: SRPG_Unpacker/SRPG_Unpacker/${{matrix.platform}}/${{env.BUILD_CONFIGURATION}}/
